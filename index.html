<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>실시간 미세먼지 조회</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, "Noto Sans KR", sans-serif;
      background: #f4f7fb;
      color: #1f2937;
    }

    .container {
      max-width: 900px;
      margin: auto;
      padding: 50px 20px;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      margin-bottom: 10px;
    }

    .subtitle {
      color: #64748b;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    .search-box {
      display: flex;
      gap: 10px;
    }

    input {
      flex: 1;
      padding: 15px;
      font-size: 17px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    #status {
      margin-top: 15px;
      white-space: pre-line;
      color: #64748b;
    }

    .error {
      color: #dc2626 !important;
    }

    .success {
      color: #16a34a !important;
    }

    .hidden {
      display: none;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
    }

    .item {
      background: #f8fafc;
      padding: 20px;
      border-radius: 15px;
    }

    .label {
      color: #64748b;
      font-size: 14px;
    }

    .value {
      font-size: 25px;
      font-weight: bold;
      margin-top: 8px;
    }

    @media (max-width: 600px) {
      .search-box {
        flex-direction: column;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header>
    <h1>🌫️ 실시간 미세먼지 조회</h1>
    <p class="subtitle">AirKorea API를 이용한 대기질 정보</p>
  </header>

  <section class="card">

    <h2>측정소 검색</h2>

    <div class="search-box">

      <input
        id="stationName"
        placeholder="측정소 이름 입력"
      >

      <button
        id="searchButton"
        onclick="searchAir()"
      >
        조회
      </button>

    </div>

    <div id="status">
      측정소 이름을 입력하세요.
    </div>

  </section>


  <section
    id="result"
    class="card hidden"
  >

    <h2 id="title">대기질 정보</h2>

    <div class="grid">

      <div class="item">
        <div class="label">미세먼지 PM10</div>
        <div class="value" id="pm10">-</div>
      </div>

      <div class="item">
        <div class="label">초미세먼지 PM2.5</div>
        <div class="value" id="pm25">-</div>
      </div>

      <div class="item">
        <div class="label">오존 O₃</div>
        <div class="value" id="o3">-</div>
      </div>

      <div class="item">
        <div class="label">이산화질소 NO₂</div>
        <div class="value" id="no2">-</div>
      </div>

      <div class="item">
        <div class="label">통합대기환경지수</div>
        <div class="value" id="khai">-</div>
      </div>

      <div class="item">
        <div class="label">측정 시간</div>
        <div class="value" id="time" style="font-size:16px">-</div>
      </div>

    </div>

  </section>

</div>


<script>

function setStatus(message, type = "") {

  const status = document.getElementById("status");

  status.textContent = message;

  status.className = type;

}


async function searchAir() {

  const stationName =
    document
      .getElementById("stationName")
      .value
      .trim();


  const button =
    document.getElementById("searchButton");


  if (!stationName) {

    setStatus(
      "측정소 이름을 입력해주세요.",
      "error"
    );

    return;

  }


  button.disabled = true;

  button.textContent = "조회 중...";


  setStatus(
    "AirKorea 데이터를 불러오는 중..."
  );


  try {

    const response =
      await fetch(
        "/api/air?stationName=" +
        encodeURIComponent(stationName)
      );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error ||
        "데이터를 불러오지 못했습니다."
      );

    }


    document
      .getElementById("title")
      .textContent =
      stationName + " 대기질 정보";


    document
      .getElementById("pm10")
      .textContent =
      data.pm10Value
        ? data.pm10Value + " ㎍/㎥"
        : "-";


    document
      .getElementById("pm25")
      .textContent =
      data.pm25Value
        ? data.pm25Value + " ㎍/㎥"
        : "-";


    document
      .getElementById("o3")
      .textContent =
      data.o3Value
        ? data.o3Value + " ppm"
        : "-";


    document
      .getElementById("no2")
      .textContent =
      data.no2Value
        ? data.no2Value + " ppm"
        : "-";


    document
      .getElementById("khai")
      .textContent =
      data.khaiValue || "-";


    document
      .getElementById("time")
      .textContent =
      data.dataTime || "-";


    document
      .getElementById("result")
      .classList
      .remove("hidden");


    setStatus(
      "✓ 조회 완료",
      "success"
    );


  } catch (error) {

    setStatus(
      "조회 실패: " + error.message,
      "error"
    );

  } finally {

    button.disabled = false;

    button.textContent = "조회";

  }

}

</script>

</body>
</html>
