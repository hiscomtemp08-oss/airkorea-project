<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>포항시 실시간 미세먼지 조회</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      font-family:
        Arial,
        "Noto Sans KR",
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #e8eef7,
          #f7f9fc
        );

      color: #253142;
    }


    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 25px;
    }


    header {
      text-align: center;
      margin-bottom: 40px;
    }


    h1 {
      margin: 0;
      font-size: 42px;
    }


    .subtitle {
      margin-top: 15px;

      font-size: 20px;

      color: #64748b;
    }


    .card {

      background:
        rgba(255, 255, 255, 0.9);

      border-radius: 28px;

      padding: 40px;

      box-shadow:
        0 15px 40px
        rgba(50, 70, 100, 0.12);

      margin-bottom: 25px;

    }


    .top-area {

      display: flex;

      align-items: center;

      justify-content:
        space-between;

      gap: 20px;

      flex-wrap: wrap;

    }


    h2 {
      margin: 0;

      font-size: 32px;
    }


    .location {

      color: #3564ba;

    }


    button {

      border: none;

      border-radius: 16px;

      padding:
        18px
        40px;

      font-size: 19px;

      font-weight: bold;

      color: white;

      background:
        #3564ba;

      cursor: pointer;

      transition:
        0.2s;

    }


    button:hover {

      transform:
        translateY(-2px);

      background:
        #294f95;

    }


    button:disabled {

      opacity: 0.6;

      cursor:
        not-allowed;

      transform:
        none;

    }


    #status {

      margin-top: 25px;

      font-size: 18px;

      color: #64748b;

      white-space:
        pre-line;

    }


    .error {

      color:
        #c0392b !important;

    }


    .success {

      color:
        #16803a !important;

    }


    .hidden {

      display:
        none;

    }


    .grid {

      margin-top: 30px;

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(220px, 1fr)
        );

      gap: 18px;

    }


    .item {

      background:
        #f7f9fc;

      border:
        1px solid
        #e3e9f2;

      border-radius: 20px;

      padding: 25px;

    }


    .label {

      font-size: 16px;

      color: #64748b;

    }


    .value {

      margin-top: 12px;

      font-size: 28px;

      font-weight: bold;

      word-break:
        break-word;

    }


    .empty-message {

      color:
        #64748b;

      line-height: 1.7;

    }


    .data-list {

      margin-top: 25px;

    }


    .data-row {

      display: grid;

      grid-template-columns:
        180px 1fr;

      gap: 20px;

      padding: 15px 0;

      border-bottom:
        1px solid #e5e7eb;

    }


    .data-key {

      font-weight: bold;

      color: #475569;

    }


    .data-value {

      color: #1e293b;

      word-break:
        break-word;

    }


    footer {

      text-align: center;

      color: #94a3b8;

      margin-top: 30px;

    }


    @media (
      max-width: 600px
    ) {

      .container {

        padding:
          35px
          15px;

      }


      h1 {

        font-size: 30px;

      }


      .subtitle {

        font-size: 16px;

      }


      .card {

        padding: 25px;

      }


      .top-area {

        align-items:
          stretch;

      }


      button {

        width: 100%;

      }


      .data-row {

        grid-template-columns:
          1fr;

        gap: 7px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <header>

      <h1>
        🌫️ 포항시 미세먼지 조회
      </h1>

      <div class="subtitle">

        경상북도 포항시
        대기오염 환경 API

      </div>

    </header>



    <!-- 조회 영역 -->

    <section class="card">


      <div class="top-area">


        <div>

          <h2>
            📍
            <span class="location">
              포항시
            </span>
            대기질 정보
          </h2>

        </div>


        <button
          id="searchButton"
          onclick="getPohangAir()"
        >

          최신 정보 조회

        </button>


      </div>



      <div id="status">

        버튼을 눌러
        포항시 대기오염 정보를 조회하세요.

      </div>


    </section>



    <!-- 결과 영역 -->

    <section
      id="resultCard"
      class="card hidden"
    >


      <h2>
        📊 조회 결과
      </h2>



      <div
        id="mainGrid"
        class="grid"
      >

      </div>



      <div
        id="dataList"
        class="data-list"
      >

      </div>


    </section>



    <footer>

      데이터 제공:
      경상북도 포항시 공공데이터 API

    </footer>


  </div>



  <script>


    // -----------------------------
    // 상태 메시지 표시
    // -----------------------------

    function setStatus(
      message,
      type = ""
    ) {

      const status =
        document.getElementById(
          "status"
        );


      status.textContent =
        message;


      status.className =
        type;

    }



    // -----------------------------
    // 값이 비어있는지 확인
    // -----------------------------

    function isEmpty(value) {

      return (
        value === null ||
        value === undefined ||
        value === ""
      );

    }



    // -----------------------------
    // 항목 이름 예쁘게 변경
    // -----------------------------

    function getKoreanName(key) {

      const names = {

        pm10:
          "미세먼지 PM10",

        pm10Value:
          "미세먼지 PM10",

        pm25:
          "초미세먼지 PM2.5",

        pm25Value:
          "초미세먼지 PM2.5",

        o3:
          "오존 O₃",

        o3Value:
          "오존 O₃",

        no2:
          "이산화질소 NO₂",

        no2Value:
          "이산화질소 NO₂",

        co:
          "일산화탄소 CO",

        coValue:
          "일산화탄소 CO",

        so2:
          "아황산가스 SO₂",

        so2Value:
          "아황산가스 SO₂",

        khai:
          "통합대기환경지수",

        khaiValue:
          "통합대기환경지수",

        dataTime:
          "측정 시간",

        data_time:
          "측정 시간"

      };


      return (
        names[key] ||
        key
      );

    }



    // -----------------------------
    // 중요 데이터 찾기
    // -----------------------------

    function findValue(
      item,
      possibleKeys
    ) {

      for (
        const key of possibleKeys
      ) {

        if (
          !isEmpty(item[key])
        ) {

          return item[key];

        }

      }


      return "-";

    }



    // -----------------------------
    // 주요 카드 생성
    // -----------------------------

    function createMainCard(
      label,
      value
    ) {

      return `

        <div class="item">

          <div class="label">

            ${label}

          </div>


          <div class="value">

            ${value}

          </div>

        </div>

      `;

    }



    // -----------------------------
    // 포항시 API 조회
    // -----------------------------

    async function getPohangAir() {


      const button =
        document.getElementById(
          "searchButton"
        );


      const resultCard =
        document.getElementById(
          "resultCard"
        );


      const mainGrid =
        document.getElementById(
          "mainGrid"
        );


      const dataList =
        document.getElementById(
          "dataList"
        );



      button.disabled = true;


      button.textContent =
        "조회 중...";


      resultCard.classList.add(
        "hidden"
      );


      setStatus(
        "포항시 대기오염 데이터를 불러오는 중입니다..."
      );



      try {


        // 포항시 전용 API 호출

        const response =
          await fetch(
            "/api/pohang-air"
          );


        const data =
          await response.json();



        if (
          !response.ok
        ) {

          throw new Error(

            data.error ||
            "API 요청에 실패했습니다."

          );

        }



        // 서버에서 받은 실제 데이터

        const item =
          data.item;



        if (
          !item
        ) {

          throw new Error(
            "포항시 대기질 데이터가 없습니다."
          );

        }



        // 주요 값 찾기

        const pm10 =
          findValue(
            item,
            [
              "pm10",
              "pm10Value",
              "PM10"
            ]
          );


        const pm25 =
          findValue(
            item,
            [
              "pm25",
              "pm25Value",
              "pm2_5",
              "PM25"
            ]
          );


        const o3 =
          findValue(
            item,
            [
              "o3",
              "o3Value",
              "O3"
            ]
          );


        const no2 =
          findValue(
            item,
            [
              "no2",
              "no2Value",
              "NO2"
            ]
          );


        const time =
          findValue(
            item,
            [
              "dataTime",
              "data_time",
              "time",
              "측정시간"
            ]
          );



        // 주요 카드 표시

        mainGrid.innerHTML =

          createMainCard(
            "미세먼지 PM10",
            pm10
          )

          +

          createMainCard(
            "초미세먼지 PM2.5",
            pm25
          )

          +

          createMainCard(
            "오존 O₃",
            o3
          )

          +

          createMainCard(
            "이산화질소 NO₂",
            no2
          )

          +

          createMainCard(
            "측정 시간",
            time
          );



        // 모든 실제 데이터 표시

        let html =

          "<h3>전체 API 데이터</h3>";



        for (
          const [key, value]
          of Object.entries(item)
        ) {

          html += `

            <div class="data-row">

              <div class="data-key">

                ${getKoreanName(key)}

              </div>


              <div class="data-value">

                ${isEmpty(value)
                  ? "-"
                  : value}

              </div>

            </div>

          `;

        }


        dataList.innerHTML =
          html;



        resultCard.classList.remove(
          "hidden"
        );


        setStatus(
          "✓ 포항시 대기오염 정보 조회가 완료되었습니다.",
          "success"
        );


      }


      catch (error) {


        console.error(
          error
        );


        setStatus(

          "조회 실패: " +
          error.message,

          "error"

        );


      }


      finally {


        button.disabled =
          false;


        button.textContent =
          "최신 정보 조회";


      }


    }


  </script>


</body>

</html>
